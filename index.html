<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trial of Allegiance — FTC Robotics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e10;
    --bg2:#141619;
    --bg3:#1b1e22;
    --line:#2a2e33;
    --steel:#8a939c;
    --steel-l:#c3cad0;
    --text:#f1f3f5;
    --muted:#9aa2aa;
    --red:#aab4bf;        /* steel accent (team grey identity) */
    --red-d:#7f8c99;
    --blue:#00a0ff;       /* cool accent (sparing) */
    --maxw:1200px;
    --disp:'Anton',Impact,sans-serif;
    --head:'Oswald',sans-serif;
    --body:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
  .red{color:var(--red)}
  ::selection{background:var(--red);color:#0d0e10}

  /* NAV */
  header{position:sticky;top:0;z-index:60;background:rgba(13,14,16,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  nav{display:flex;align-items:center;justify-content:space-between;height:70px}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .mk{width:34px;height:34px;background:var(--red);display:grid;place-items:center;transform:skewX(-10deg)}
  .brand .mk b{transform:skewX(10deg);font-family:var(--disp);color:#0d0e10;font-size:16px;line-height:1}
  .brand .nm{font-family:var(--head);font-weight:700;letter-spacing:2px;font-size:15px;text-transform:uppercase}
  .navlinks{display:flex;gap:30px;align-items:center}
  .navlinks a{font-family:var(--head);font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;transition:color .2s;position:relative}
  .navlinks a:hover{color:var(--text)}
  .navlinks a:not(.lang):after{content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;background:var(--red);transition:width .25s}
  .navlinks a:not(.lang):hover:after{width:100%}
  .lang{font-family:var(--head);border:1px solid var(--line);background:transparent;color:var(--steel-l);padding:7px 14px;font-size:13px;font-weight:600;letter-spacing:1.5px;cursor:pointer;text-transform:uppercase}
  .lang:hover{border-color:var(--red);color:var(--red)}
  .menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);padding:8px 12px;cursor:pointer;font-size:18px}

  /* HERO */
  .hero{position:relative;min-height:92vh;display:flex;align-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
  .herobg{position:absolute;inset:0;z-index:0;overflow:hidden;background-color:#0d0e10}
  .slide{position:absolute;inset:0;background-size:cover;background-position:center 35%;opacity:0;transition:opacity 1.5s ease;filter:saturate(1.85) contrast(1.12) brightness(1.08);transform:scale(1.06)}
  .slide.active{opacity:1;animation:kenburns 7s ease-out forwards}
  @keyframes kenburns{from{transform:scale(1.06)}to{transform:scale(1.16)}}
  .slide.s1{background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/FIRST_Robotics_Competition_Palmetto_Regional_(5558669881).jpg?width=1920')}
  .slide.s2{background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/FIRST_Robotics_Competition_(FRC)_2024_Crescendo_Playing_Field.jpg?width=1920')}
  .aboutbg{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
  .about-svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:116%;height:auto;opacity:.16;pointer-events:none}
  @media(max-width:900px){.about-svg{width:220%;opacity:.1}}
  .hero:before{content:"";position:absolute;inset:0;z-index:1;background:
    linear-gradient(90deg,rgba(13,14,16,.95) 0%,rgba(13,14,16,.88) 18%,rgba(13,14,16,.62) 34%,rgba(13,14,16,.32) 52%,rgba(13,14,16,.12) 72%,rgba(13,14,16,.03) 100%),
    linear-gradient(0deg,var(--bg) 0%,rgba(13,14,16,.55) 13%,rgba(13,14,16,.14) 32%,transparent 52%)}
  .hero:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:soft-light;opacity:.5;background:linear-gradient(115deg,#0a84ff 0%,#7b2ff7 42%,#ff2d55 70%,#ffb300 100%)}
  /* speed stripes */
  .stripes{position:absolute;top:0;right:0;height:100%;width:55%;z-index:1;opacity:.2}
  .hero-credit{position:absolute;right:16px;bottom:13px;z-index:3;font-family:var(--head);font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.5);text-transform:uppercase}
  .stripes span{position:absolute;top:-20%;height:140%;width:12px;background:linear-gradient(var(--red),transparent);transform:skewX(-18deg)}
  .stripes span:nth-child(1){right:8%;opacity:.9}
  .stripes span:nth-child(2){right:14%;width:6px;opacity:.5}
  .stripes span:nth-child(3){right:19%;width:3px;opacity:.35}
  .hero .wrap{position:relative;z-index:2;width:100%}
  .kicker{display:inline-flex;align-items:center;gap:12px;font-family:var(--head);font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--steel-l);margin-bottom:26px}
  .kicker:before{content:"";width:44px;height:2px;background:var(--red)}
  h1.big{font-family:var(--disp);font-weight:400;text-transform:uppercase;line-height:.86;letter-spacing:1px;font-size:clamp(58px,12vw,150px)}
  h1.big .w{display:block}
  h1.big .w2{color:transparent;-webkit-text-stroke:2px var(--steel);}
  h1.big .dot{color:var(--red)}
  p.lead{max-width:640px;margin-top:28px;font-size:19px;color:var(--muted)}
  .cta{display:flex;gap:16px;margin-top:38px;flex-wrap:wrap}
  .btn{font-family:var(--head);padding:15px 30px;font-weight:600;letter-spacing:2px;text-transform:uppercase;font-size:14px;cursor:pointer;border:2px solid var(--red);background:var(--red);color:#0d0e10;transition:.2s;display:inline-flex;align-items:center;gap:10px}
  .btn:hover{background:transparent;color:var(--red)}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--steel-l)}
  .btn.ghost:hover{border-color:var(--steel-l);color:#fff}
  .hstats{display:flex;gap:0;margin-top:60px;border-top:1px solid var(--line);flex-wrap:wrap}
  .hstats .s{padding:22px 40px 0 0;margin-right:40px}
  .hstats .n{font-family:var(--disp);font-size:40px;color:#fff;line-height:1}
  .hstats .n .red{color:var(--red)}
  .hstats .k{font-family:var(--head);font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-top:6px}

  /* LOADER */
  #loader{position:fixed;inset:0;z-index:9999;background:#0d0e10;display:grid;place-items:center;transition:opacity .8s ease,visibility .8s}
  #loader.hide{opacity:0;visibility:hidden}
  .emblem{position:relative;width:132px;height:144px}
  .emblem svg.layer{position:absolute;inset:0;width:100%;height:100%}
  .emblem .base{color:rgba(255,255,255,.14)}
  .emblem .fill{color:#fff;clip-path:inset(100% 0 0 0);animation:fillup 1.9s cubic-bezier(.4,0,.2,1) forwards .2s}
  @keyframes fillup{to{clip-path:inset(0 0 0 0)}}
  .loader-txt{position:absolute;bottom:24%;left:0;right:0;text-align:center;font-family:var(--head);letter-spacing:5px;font-size:12px;color:#7f8c99;text-transform:uppercase;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  /* CAROUSEL DOTS */
  .dots{position:absolute;bottom:26px;left:0;right:0;z-index:3;display:flex;gap:14px;justify-content:center;align-items:center}
  .dots .dot{width:8px;height:8px;border-radius:50%;border:none;background:rgba(255,255,255,.65);cursor:pointer;padding:0;transition:.3s}
  .dots .dot.active{background:transparent;border:2px solid var(--red);width:15px;height:15px}
  /* HERO ENTRANCE */
  @keyframes fadeup{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .hero .kicker{animation:fadeup .8s ease both 2.05s}
  .hero h1.big{animation:fadeup .9s ease both 2.18s}
  .hero p.lead{animation:fadeup .8s ease both 2.36s}
  .hero .cta{animation:fadeup .8s ease both 2.52s}
  .hero .hstats{animation:fadeup .8s ease both 2.66s}

  /* SECTIONS */
  section.blk{position:relative;padding:100px 0;border-bottom:1px solid var(--line)}
  .idx{position:absolute;top:40px;right:5%;font-family:var(--disp);font-size:clamp(120px,20vw,280px);line-height:1;color:#fff;opacity:.03;z-index:0;pointer-events:none}
  .blk .wrap{position:relative;z-index:2}
  .eyebrow{font-family:var(--head);font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--red);margin-bottom:16px;display:flex;align-items:center;gap:12px}
  .eyebrow:before{content:"";width:28px;height:2px;background:var(--red)}
  h2.sec{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(34px,6vw,66px);line-height:.92;letter-spacing:1px;margin-bottom:22px}
  .sub{font-family:var(--body);color:var(--muted);max-width:720px;margin-bottom:50px;font-size:17px}

  .grid{display:grid;gap:2px;background:var(--line)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--bg);padding:36px 32px;transition:.25s;position:relative}
  .card:before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .28s}
  .card:hover{background:var(--bg2)}
  .card:hover:before{transform:scaleX(1)}
  .card .ic{font-family:var(--disp);font-size:26px;color:var(--red);display:block;margin-bottom:16px}
  .card h3{font-family:var(--head);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
  .card p{color:var(--muted);font-size:15px}

  .note{margin-top:40px;background:var(--bg2);border-left:4px solid var(--red);padding:26px 30px;color:var(--steel-l);font-size:16px}
  .note strong{color:#fff;font-family:var(--head);letter-spacing:.5px}
  .note em{color:var(--red);font-style:normal;font-weight:600}

  .flist{list-style:none;margin-top:6px}
  .flist li{padding:12px 0;border-bottom:1px solid var(--line);color:var(--steel-l);font-size:16px;font-family:var(--head);font-weight:400;letter-spacing:.3px;display:flex;gap:12px;align-items:baseline}
  .flist li:before{content:"›";color:var(--red);font-family:var(--disp);font-size:20px}

  .arrow{font-family:var(--head);text-transform:uppercase;letter-spacing:2px;font-size:14px;color:#fff;display:inline-flex;align-items:center;gap:10px;margin-top:8px}
  .arrow .r{color:var(--red);transition:transform .2s}
  .arrow:hover .r{transform:translateX(6px)}

  /* CONTACT */
  .contact-box{background:var(--bg2);border:1px solid var(--line);padding:50px;display:grid;grid-template-columns:1.1fr 1fr;gap:48px}
  .field{margin-bottom:20px}
  .field label{font-family:var(--head);display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .field input,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:13px 15px;font-family:var(--body);font-size:15px}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--red)}
  .cinfo p{margin-bottom:18px;color:var(--steel-l);font-size:16px}
  .cinfo .k{font-family:var(--head);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:2px;display:block;margin-bottom:2px}
  .cinfo a{color:var(--red)}

  footer{padding:40px 0;text-align:center;color:var(--muted);font-family:var(--head);letter-spacing:1px;font-size:13px;text-transform:uppercase}
  footer p{margin-top:8px}

  @media(max-width:900px){
    .navlinks{display:none}
    .navlinks.open{display:flex;position:absolute;top:70px;left:0;right:0;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--line);padding:24px 28px;gap:22px}
    .menu-btn{display:block}
    .g3,.g2{grid-template-columns:1fr}
    .contact-box{grid-template-columns:1fr;padding:30px}
    .stripes{opacity:.25}
  }
</style>
</head>

  function apply(){

    document.documentElement.lang=lang;
    document.getElementById('langBtn').textContent=lang==='tr'?'EN':'TR';

<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll(".hero .slide"));
  var dots=[].slice.call(document.querySelectorAll(".hero .dot"));
  var i=0,t;
  function go(n){slides[i]&&slides[i].classList.remove("active");dots[i]&&dots[i].classList.remove("active");i=(n+slides.length)%slides.length;slides[i]&&slides[i].classList.add("active");dots[i]&&dots[i].classList.add("active");}
  if(slides.length){slides[0].classList.add("active");dots[0]&&dots[0].classList.add("active");}
  function start(){if(slides.length>1)t=setInterval(function(){go(i+1);},5000);}
  dots.forEach(function(d,k){d.addEventListener("click",function(){clearInterval(t);go(k);start();});});
  start();
  var ld=document.getElementById("loader");
  function hide(){ld&&ld.classList.add("hide");}
  window.addEventListener("load",function(){setTimeout(hide,2100);});
  setTimeout(hide,3200);
})();
</script>
